services:
  backend:
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
      network: host
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        GITHUB_PROXY: ${GITHUB_PROXY:-}
    env_file:
      - ../../.env
    ports:
      - "127.0.0.1:${HY2_AUTH_PORT:?load the deployment .env with --env-file}:${HY2_AUTH_PORT:?load the deployment .env with --env-file}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    build:
      context: ../..
      dockerfile: deploy/nginx/Dockerfile
      network: host
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    env_file:
      - ../../.env
    ports:
      - "${APP_BIND_HOST:-0.0.0.0}:${APP_PORT:-18080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 3

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?load the deployment .env with --env-file}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?load the deployment .env with --env-file}
      MYSQL_USER: ${MYSQL_USER:?load the deployment .env with --env-file}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?load the deployment .env with --env-file}
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:?load the deployment .env with --env-file}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
